<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ஏ.ஆர்.ரஹ்மான் - A.R. Rahman Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

<h2>🎵 ஏ.ஆர்.ரஹ்மான் 🎵<br><span class="subtitle">A.R. Rahman - The Musical Storm</span></h2>

<img id="cover" src="images/cover1.jpg">

<h3 id="title">Song One</h3>
<p id="artist">Artist One</p>

<audio id="audio"></audio>

<input type="range" id="progress" value="0">

<div class="time">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>

<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="playPause()">▶</button>
<button onclick="nextSong()">⏭</button>
</div>

<div class="volume">
Volume
<input type="range" id="volume" min="0" max="1" step="0.1" value="1">
</div>

<h3>Playlist</h3>

<ul id="playlist"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
